[package]
name = "autocommit-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Generate Conventional Commit messages for staged git changes with the Gemini free tier"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["git", "commit", "gemini", "conventional-commits", "cli"]
categories = ["command-line-utilities", "development-tools"]
# repository = "https://github.com/<user>/autocommit"
exclude = ["/docs", "/AGENTS.md", "/.github"]

[[bin]]
name = "acm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
tempfile = "3"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
serde_json = "1"
