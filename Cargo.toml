[package]
name = "autocommit"
version = "0.1.0"
edition = "2024"
description = "Generate Conventional Commit messages for staged changes with Gemini"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
serde_json = "1"
